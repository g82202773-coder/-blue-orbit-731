name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout LIFE EMPIRE
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest"

      - name: Install Godot 4.7 and Android export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: true

      - name: Configure Godot Android paths and debug keystore
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$SDK_ROOT"
          EOF
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project and fail on script parse errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" import.log; then
            echo "Godot import reported script errors."
            exit 1
          fi

      - name: Run economy and persistence regression tests
        run: godot --headless --path . --script res://tests/economy_smoke.gd

      - name: Run main scene runtime assertions
        run: godot --headless --path . --script res://tests/scene_smoke.gd

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/LIFE-EMPIRE-debug.apk
          test -s build/LIFE-EMPIRE-debug.apk
          ls -lh build/LIFE-EMPIRE-debug.apk

      - name: Set up Python for screenshot validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install screenshot inspection dependency
        run: python -m pip install pillow

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch LIFE EMPIRE in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set +e
            PACKAGE="com.lifeempire.navapura.graphics_preview"
            mkdir -p build
            adb logcat -c

            adb install -r build/LIFE-EMPIRE-debug.apk > build/install.log 2>&1
            INSTALL_STATUS=$?
            cat build/install.log

            # Launch the package's launcher activity using Monkey's default
            # MAIN/LAUNCHER intent. Explicit -c parsing is inconsistent on
            # some emulator images.
            adb shell monkey -p "$PACKAGE" 1 > build/launch.log 2>&1
            LAUNCH_STATUS=$?
            cat build/launch.log

            sleep 20

            adb shell dumpsys activity activities > build/emulator-activities.txt 2>&1
            adb shell dumpsys meminfo "$PACKAGE" > build/emulator-memory.txt 2>&1
            adb shell screencap -p /sdcard/life-empire-screen.png
            SCREEN_STATUS=$?
            if [ "$SCREEN_STATUS" -eq 0 ]; then
              adb pull /sdcard/life-empire-screen.png build/life-empire-screen.png
            fi
            adb logcat -d -v time > build/emulator-logcat.txt 2>&1

            PID="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r')"
            echo "Package PID: $PID"
            echo "Install status: $INSTALL_STATUS; launch status: $LAUNCH_STATUS; screenshot status: $SCREEN_STATUS"

            if grep -E "FATAL EXCEPTION|Fatal signal|SCRIPT ERROR:|Parse Error:|Failed to load script" build/emulator-logcat.txt; then
              echo "Android emulator log contains a fatal startup or script error."
              exit 1
            fi
            if [ "$INSTALL_STATUS" -ne 0 ] || [ "$LAUNCH_STATUS" -ne 0 ] || [ -z "$PID" ] || [ "$SCREEN_STATUS" -ne 0 ]; then
              echo "LIFE EMPIRE failed installation, launch, process-alive, or screenshot validation."
              exit 1
            fi

            python - <<'PY'
            from PIL import Image
            image = Image.open("build/life-empire-screen.png").convert("RGB")
            if image.width <= image.height:
                raise SystemExit(f"Expected landscape screenshot, got {image.width}x{image.height}")
            sample = image.resize((96, 54))
            colors = len(set(sample.getdata()))
            print(f"Emulator screenshot: {image.width}x{image.height}; sampled colors: {colors}")
            if colors < 40:
                raise SystemExit("Screenshot looks nearly blank; refusing to pass visual startup smoke test.")
            PY


      - name: Upload emulator screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-EMPIRE-android-emulator-report
          path: |
            build/life-empire-screen.png
            build/emulator-logcat.txt
            build/emulator-activities.txt
            build/emulator-memory.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-EMPIRE-debug-APK
          path: build/LIFE-EMPIRE-debug.apk
          if-no-files-found: error
          retention-days: 14
