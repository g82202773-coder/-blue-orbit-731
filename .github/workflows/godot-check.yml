name: Godot 4.7 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Godot 4.7
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: false

      - name: Import project and fail on script parse errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" import.log; then
            echo "Godot import reported script errors."
            exit 1
          fi

      - name: Run economy and save/load tests
        run: godot --headless --path . --script res://tests/economy_smoke.gd

      - name: Run world geometry and upgrade-visual smoke test
        run: godot --headless --path . res://tests/world_scene_smoke.tscn

      - name: Launch main scene and fail on startup script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee startup.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" startup.log; then
            echo "Main scene reported script errors."
            exit 1
          fi
